<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
<header>
<div class="logo">GROUP 8</div>

<nav id="navMenu">
<a href="index.html">Home</a>
<a href="gallery.html">Gallery</a>

<a href="contact.html" class="active">Contact</a>
</nav>
</header>
<section>
<h1>Contact Us</h1>
<p>Fill the form below - we will get back to you!</p>
<form class="contact-form" onsubmit="return sendForm(event)">
<label for="name">Full Name:</label>
<input type="text" id="name" placeholder="Enter your full name" required>
<label for="email">Email:</label>
<input type="email" id="email" placeholder="example@gmail.com" required>
<label for="reason">Reason for Contact:</label>
<select id="reason" required>
<option value="">-- Select Reason --</option>
<option value="feedback">Feedback</option>
<option value="support">Support</option>
<option value="collaboration">Collaboration</option>
</select>
<label for="message">Detailed Message:</label>
<textarea id="message" rows="5" placeholder="Write your message here..." required></textarea>
<button type="submit" class="btn">Submit</button>
<button type="reset" class="btn btn2">Reset</button>
<p id="form-msg"></p>
</form>
</section>
<footer>
<p>© 2026 Group 8 - All Rights Reserved</p>
<p><a href="#">Facebook</a> | <a href="#">Instagram</a> | <a href="#">Twitter / X</a> | <a href="#">YouTube</a></p>
</footer>
<script src="script.js"></script>
</body>
</html>
